name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: sh test/check.sh
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css js icons manifest.webmanifest sw.js _site/
          # Tycho, the engine (a git submodule): only the built scripts the page loads
          mkdir -p _site/vendor/tycho/dist
          for f in $(grep -o 'src="vendor/tycho/dist/[^"]*"' index.html | cut -d'"' -f2); do cp "$f" _site/vendor/tycho/dist/; done
          touch _site/.nojekyll
          # stamp this deploy: a new service worker each time (the commit),
          # and version.json naming the build it carries (js/version.js),
          # which a page open on an older one loads onto (js/pwa.js)
          sed -i "s/__BUILD__/$(echo "$GITHUB_SHA" | cut -c1-7)/" _site/sw.js
          node -e "const b = require('fs').readFileSync('js/version.js', 'utf8').match(/BUILD_INFO = '([^']*)'/)[1]; require('fs').writeFileSync('_site/version.json', JSON.stringify({ build: b }))"
          cat _site/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # The headless tests: floor generation over many seeds with golden hashes,
  # and a phone (upright and sideways) and desktop smoke run.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm ci
      - run: npm test
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      # the pictures a failing test leaves (the GPU's frame against the 2D
      # path's, the smoke run's screenshots), to look at
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-out
          path: test/out
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request'
    needs: [check, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
