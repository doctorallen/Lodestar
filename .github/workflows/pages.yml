name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: sh test/check.sh
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css js _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # The headless tests: floor generation over many seeds with golden hashes,
  # and a phone (upright and sideways) and desktop smoke run.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm ci
      - run: npm test
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      # the pictures a failing test leaves (the GPU's frame against the 2D
      # path's, the smoke run's screenshots), to look at
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-out
          path: test/out
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request'
    needs: [check, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
