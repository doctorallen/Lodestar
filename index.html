<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lodestar">
<meta name="description" content="Dive beneath a fallen star. Mine, loot, and get out before the dark takes your haul.">
<title>Lodestar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="bars">
      <div id="hud-hp" class="bar hp"><div id="hp-fill" class="fill"></div><span id="hp-text" class="bar-text"></span></div>
      <div id="hud-ch" class="bar ch"><div id="ch-fill" class="fill"></div></div>
      <div id="hud-pull" class="bar pull" title="The star's pull"><div id="pull-fill" class="fill"></div></div>
    </div>
    <span id="hud-depth" class="hud-depth"></span>
    <button id="btn-cargo" class="icon-btn cargo" aria-label="Cargo"></button>
    <button id="btn-pause" class="icon-btn" aria-label="Pause">II</button>
  </header>

  <main id="stage">
    <canvas id="view"></canvas>
    <canvas id="view-glow"></canvas>
    <canvas id="bloom"></canvas>
    <canvas id="view-over"></canvas>
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="speech" class="speech" hidden aria-live="polite"></div>

  <div id="deck-left" class="deck">
    <span class="deck-hint">MOVE</span>
  </div>
  <div id="deck-right" class="deck">
    <button id="btn-act" class="deck-btn act" hidden></button>
    <button id="btn-off" class="deck-btn off" hidden></button>
    <button id="btn-dash" class="deck-btn dash">DASH</button>
    <button id="btn-mine" class="deck-btn mine">MINE</button>
    <button id="btn-main" class="deck-btn main">SWING</button>
  </div>
  <div id="stick-base" class="stick-base" hidden><div id="stick-knob" class="stick-knob"></div></div>

  <!-- the screens; only one shows at a time -->
  <section id="screen-story" class="screen story" hidden>
    <p id="story-text" class="story-text"></p>
    <div class="menu"><button class="btn primary" data-act="storyNext">CONTINUE</button></div>
    <p id="story-step" class="note center"></p>
  </section>

  <section id="screen-resume" class="screen story" hidden>
    <h2>UNDER WAY</h2>
    <p id="resume-text" class="story-text"></p>
    <div class="menu"><button class="btn primary" data-act="resumeRun">CARRY ON</button><button class="btn danger" data-act="dropRun">GIVE IT UP</button></div>
  </section>

  <section id="screen-wreck" class="screen panel" hidden>
    <h2>THE MERIDIAN</h2>
    <div id="wreck-body" class="list"></div>
    <div class="menu"><button class="btn" data-act="back">BACK</button></div>
  </section>

  <section id="screen-report" class="screen" hidden>
    <h2 id="report-title"></h2>
    <p id="report-body" class="report"></p>
    <div class="menu"><button class="btn primary" data-act="closeReport">CONTINUE</button></div>
  </section>

  <section id="screen-descend" class="screen panel" hidden>
    <h2>DESCEND</h2>
    <div id="descend-body" class="list"></div>
    <div class="menu"><button class="btn" data-act="back">BACK</button></div>
  </section>

  <section id="screen-forge" class="screen panel" hidden>
    <h2 id="forge-title">THE FORGE</h2>
    <div id="forge-body" class="list"></div>
    <div class="menu"><button class="btn" data-act="back">BACK</button></div>
  </section>

  <section id="screen-gear" class="screen panel" hidden>
    <h2 id="gear-title">GEAR</h2>
    <div id="gear-body" class="list"></div>
    <div class="menu"><button class="btn" data-act="back">BACK</button></div>
  </section>

  <section id="screen-star" class="screen panel" hidden>
    <h2>THE STAR</h2>
    <div id="star-body" class="list"></div>
    <div class="menu"><button class="btn" data-act="back">BACK</button></div>
  </section>

  <section id="screen-cargo" class="screen panel" hidden>
    <h2>CARGO</h2>
    <div id="cargo-body" class="list"></div>
    <div class="menu"><button class="btn primary" data-act="resume">RESUME</button></div>
  </section>

  <section id="screen-pause" class="screen" hidden>
    <h2>PAUSED</h2>
    <div class="menu">
      <button id="pause-resume" class="btn primary" data-act="resume">RESUME</button>
      <button id="pause-cargo" class="btn" data-act="go" data-arg="screen-cargo">CARGO</button>
      <button id="pause-beacon" class="btn" data-act="beacon" hidden>PLANT THE BEACON</button>
      <button id="pause-recall" class="btn" data-act="recall">EMERGENCY RECALL</button>
      <button id="pause-abandon" class="btn danger" data-act="abandon">ABANDON DIVE</button>
    </div>
    <p id="pause-note" class="note">Recalling takes a few seconds standing still and costs part of the cargo. Abandoning loses all of it. What you wear and your pocket are safe either way.</p>
    <div class="build" id="build"></div>
  </section>

  <section id="screen-anvil" class="screen anvil" hidden>
    <h2>THE ANVIL</h2>
    <p id="anvil-what" class="note center"></p>
    <canvas id="anvil-canvas"></canvas>
    <p id="anvil-call" class="anvil-call"></p>
  </section>

  <section id="screen-reveal" class="screen reveal" hidden>
    <div id="reveal-body" class="reveal-stage"></div>
  </section>

  <div id="card" class="card-wrap" hidden><div id="card-body" class="card"></div></div>
</div>

<script src="js/util.js"></script>
<script src="js/version.js"></script>
<script src="js/tuning.js"></script>
<script src="js/save.js"></script>
<script src="js/floor.js"></script>
<script src="js/art.js"></script>
<script src="js/art2.js"></script>
  <script src="js/art3.js"></script>
<script src="js/diver.js"></script>
<script src="js/flora.js"></script>
<script src="js/blueprints.js"></script>
<script src="js/items.js"></script>
<script src="js/game.js"></script>
<script src="js/enemies.js"></script>
<script src="js/combat.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/rifts.js"></script>
<script src="js/render.js"></script>
<script src="js/hub.js"></script>
<script src="js/story.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/anvil.js"></script>
<script src="js/main.js"></script>
</body>
</html>
