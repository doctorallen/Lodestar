<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lodestar">
<meta name="description" content="Carry a fallen star's light out into a dark world, one vein at a time, and make it live.">
<title>Lodestar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="bars">
      <div id="hud-hp" class="bar hp" title="Your light, which is your health"><div id="hp-fill" class="fill"></div><span id="hp-text" class="bar-text"></span></div>
      <div id="hud-thread" class="bar thread" title="The thread left in your hand" hidden><div id="thread-fill" class="fill"></div></div>
    </div>
    <span id="hud-depth" class="hud-depth"></span>
    <button id="btn-map" class="icon-btn map" aria-label="The star: the map, the shapes">THE STAR</button>
    <button id="btn-pause" class="icon-btn" aria-label="Pause">II</button>
  </header>

  <main id="stage">
    <canvas id="view"></canvas>
    <canvas id="view-glow"></canvas>
    <canvas id="bloom"></canvas>
    <canvas id="view-over"></canvas>
    <div id="hud-goal" class="hud-goal" hidden></div>
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="speech" class="speech" hidden aria-live="polite"></div>

  <div id="deck-left" class="deck">
    <span class="deck-hint">MOVE</span>
  </div>
  <div id="deck-right" class="deck">
    <button id="btn-act" class="deck-btn act" hidden></button>
    <button id="btn-off" class="deck-btn off" hidden></button>
    <button id="btn-dash" class="deck-btn dash">DASH</button>
    <button id="btn-main" class="deck-btn main">ARC</button>
  </div>
  <div id="stick-base" class="stick-base" hidden><div id="stick-knob" class="stick-knob"></div></div>

  <!-- the screens; only one shows at a time -->
  <section id="screen-story" class="screen story" hidden>
    <p id="story-text" class="story-text"></p>
    <div class="menu"><button class="btn primary" data-act="storyNext">CONTINUE</button></div>
    <p id="story-step" class="note center"></p>
  </section>

  <section id="screen-map" class="screen panel" hidden>
    <header class="screen-head"><div class="head-in"><h2>THE STAR</h2><button class="head-close" data-act="back" aria-label="Close">✕</button></div></header>
    <div class="map-wrap" id="map-wrap"><canvas id="map-cv" class="world-map" aria-label="The world: the star in the middle, the veins of its light, the nodes"></canvas></div>
    <div id="map-body" class="list"></div>
  </section>

  <section id="screen-pause" class="screen" hidden>
    <h2>PAUSED</h2>
    <div class="menu">
      <button id="pause-resume" class="btn primary" data-act="resume">RESUME</button>
    </div>
    <div class="menu sound-row">
      <button id="pause-music" class="btn" data-act="soundSet" data-arg="music">MUSIC: ON</button>
      <button id="pause-sfx" class="btn" data-act="soundSet" data-arg="sfx">SOUNDS: ON</button>
      <button id="pause-lab" class="btn" data-act="go" data-arg="screen-lab">PAINT LAB</button>
      <button id="pause-fine" class="btn" data-act="fineSet" hidden>FINE GRAIN: OFF</button>
    </div>
    <div class="menu"><button class="btn quiet" data-act="replayIntro">THE LANDING AGAIN</button><button id="pause-restart" class="btn danger quiet" data-act="restartAsk">START OVER</button></div>
    <div class="build" id="build"></div>
  </section>

  <section id="screen-lab" class="screen lab" hidden>
    <div class="lab-top">
      <button class="btn primary" data-act="labBack">BACK</button>
      <h3>PAINT LAB</h3>
      <button id="lab-reset" class="btn quiet" data-act="labReset">RESET</button>
    </div>
    <div id="lab-rows" class="list"></div>
    <p class="note">Each row applies at once; the ground round you repaints over a moment.</p>
  </section>

  <section id="screen-restart" class="screen" hidden>
    <h2>START OVER?</h2>
    <p class="note center">Everything is lost: the star, the world and all you've lit. Sound and lamp settings are kept.</p>
    <div class="menu">
      <button class="btn primary" data-act="restartBack">BACK</button>
      <button id="restart-go" class="btn danger" data-act="startOver" data-confirm="TAP AGAIN: ERASE IT ALL">START OVER</button>
    </div>
  </section>

  <!-- the opening: painted scenes over everything, then the world (intro.js) -->
  <div id="intro" class="intro" hidden>
    <canvas id="intro-view"></canvas>
    <div id="intro-cap" class="intro-cap" aria-live="polite"></div>
    <button id="intro-skip" class="intro-skip">SKIP INTRO</button>
    <p id="intro-sound" class="intro-sound" hidden>TAP FOR SOUND</p>
  </div>
</div>

<!-- the loading: the Charter's systems booting up (loader.js); its mark, the
     Lodestar as the game draws it (hubart.js hartStar), drawn into the
     canvas as the screen opens -->
<section id="loader" class="loader" aria-live="polite">
  <div class="ld-in">
    <div class="ld-head">
      <div class="ld-mark"><div class="ld-halo"></div><div class="ld-ring"></div><canvas class="ld-star-cv" width="100" height="100" hidden aria-hidden="true"></canvas></div>
      <h1 class="ld-title">LODESTAR</h1>
      <p class="ld-sub">THE CHARTER · KINDLER SYSTEMS</p>
    </div>
    <div class="ld-body">
      <div class="ld-log"></div>
      <div class="ld-bar"><div class="ld-fill"></div><div class="ld-segs"></div></div>
      <div class="ld-foot"><span class="ld-now">POWERING UP</span><span class="ld-pct">  0%</span></div>
      <p class="ld-go" hidden>TAP TO BEGIN</p>
    </div>
  </div>
</section>

<script src="js/util.js"></script>
<script src="js/version.js"></script>
<script src="js/tuning.js"></script>
<script src="js/save.js"></script>
<script src="js/lab.js"></script>
<script src="js/loader.js"></script>
<script src="js/audio.js"></script>
<script src="js/music.js"></script>
<script src="js/sndbank.js"></script>
<script src="js/floor.js"></script>
<script src="js/art.js"></script>
<script src="js/paint.js"></script>
<script src="js/paintrock.js"></script>
<script src="js/painthole.js"></script>
<script src="js/art2.js"></script>
<script src="js/art3.js"></script>
<script src="js/foesart.js"></script>
<script src="js/foespaint.js"></script>
<script src="js/diver.js"></script>
<script src="js/flora.js"></script>
<script src="js/climes.js"></script>
<script src="js/regions.js"></script>
<script src="js/circuits.js"></script>
<script src="js/game.js"></script>
<script src="js/affixes.js"></script>
<script src="js/enemies.js"></script>
<script src="js/foes.js"></script>
<script src="js/combat.js"></script>
<script src="js/life.js"></script>
<script src="js/storm.js"></script>
<script src="js/hazards.js"></script>
<script src="js/undergrowth.js"></script>
<script src="js/pflora.js"></script>
<script src="js/shadow.js"></script>
<script src="js/pshadow.js"></script>
<script src="js/air.js"></script>

<script src="js/render.js"></script>
<script src="js/perf.js"></script>
<script src="js/gllight.js"></script>
<script src="js/castfx.js"></script>
<script src="js/hardlight.js"></script>
<script src="js/natures.js"></script>
<script src="js/reactions.js"></script>
<script src="js/resonance.js"></script>
<script src="js/hubart.js"></script>

<script src="js/intro.js"></script>
<script src="js/main.js"></script>
</body>
</html>
